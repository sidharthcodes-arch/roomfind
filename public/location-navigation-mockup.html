<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomFind - Location & Navigation Section Mockup</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["DM Sans", "sans-serif"],
          },
          colors: {
            brand: {
              DEFAULT: "#00a884",
              hover: "#008f6f",
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#ececea] text-slate-800 font-sans min-h-screen p-4 flex flex-col items-center justify-center antialiased">

  <!-- Mobile Container matching current app (max-w-md) -->
  <div class="w-full max-w-md mx-auto space-y-4">
    
    <div class="px-1 text-center">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Production Component Standalone Mockup</h2>
      <h1 class="text-lg font-bold text-slate-900 mt-0.5">Location & Navigation Section</h1>
    </div>

    <!-- SEPARATE LOCATION & NAVIGATION CARD (Exact component from app/listings/[id]/page.js) -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
      <!-- Unified Location & Address Header Block -->
      <div class="p-3.5 px-4 bg-slate-50/70 border-b border-slate-100 space-y-2.5">
        <!-- Top row: Header & Distance Badge -->
        <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-slate-200/70">
          <div class="flex items-center gap-2 min-w-0">
            <svg class="w-6 h-6 fill-current text-emerald-600 shrink-0" width="24" height="24" viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5-2.5z" />
            </svg>
            <h3 class="text-lg font-extrabold text-slate-900 leading-snug">
              Location & Navigation
            </h3>
          </div>

          <span class="text-xs font-semibold text-emerald-700 bg-white border border-emerald-200/80 px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-2xs shrink-0">
            <svg class="w-3.5 h-3.5 text-[#D85A30] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="19" r="3"/>
              <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/>
              <circle cx="18" cy="5" r="3"/>
            </svg>
            <span id="distance-badge">1.2 km away</span>
          </span>
        </div>

        <!-- Address Row + Copy Button -->
        <div class="flex items-start justify-between gap-3 pt-0.5">
          <div class="min-w-0 flex-1">
            <p id="address-text" class="text-[13.5px] font-semibold text-slate-800 leading-snug">
              Block EP, Sector V, Salt Lake
            </p>
            <p id="city-text" class="text-xs font-medium text-slate-500 mt-0.5 leading-snug">
              Kolkata, West Bengal
            </p>
          </div>

          <button
            id="copy-btn"
            onclick="handleCopyAddress()"
            class="shrink-0 flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-white border border-slate-200/80 hover:bg-slate-100 text-slate-700 text-xs font-bold transition-colors shadow-2xs"
          >
            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span id="copy-text">Copy</span>
          </button>
        </div>
      </div>

      <!-- Google Maps View -->
      <div class="relative bg-slate-100 h-72 w-full border-t border-slate-200/60 overflow-hidden group">
        <iframe
          src="https://maps.google.com/maps?q=22.5726,88.4331&z=17&output=embed"
          class="w-full h-full border-0 filter contrast-[1.02]"
          title="Listing Location Map"
          loading="lazy"
        ></iframe>
      </div>

      <!-- Get Directions Button Footer -->
      <div class="p-3 bg-slate-100/60 border-t border-slate-200/60">
        <a
          href="https://www.google.com/maps/dir/?api=1&destination=22.5726,88.4331"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center justify-center gap-2 w-full py-3 rounded-xl bg-[#00a884] hover:bg-[#008f6f] text-white font-bold text-sm transition-all shadow-xs active:scale-98"
        >
          <svg class="w-4 h-4 fill-current text-white shrink-0" viewBox="0 0 24 24">
            <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9A1 1 0 003 5.8v13.4a1 1 0 001.26.96L9 18.9l6 2.1 5.64-1.9a1 1 0 00.36-.9V4.8a1 1 0 00-.5-.8zm-6.5 14.7l-4-1.4V5.3l4 1.4v11.0z"/>
          </svg>
          <span>Get Directions in Google Maps</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    function handleCopyAddress() {
      const fullAddr = "Block EP, Sector V, Salt Lake, Kolkata, West Bengal";
      navigator.clipboard.writeText(fullAddr);
      const copyTextEl = document.getElementById("copy-text");
      copyTextEl.innerText = "Copied!";
      setTimeout(() => {
        copyTextEl.innerText = "Copy";
      }, 2500);
    }
  </script>
</body>
</html>
